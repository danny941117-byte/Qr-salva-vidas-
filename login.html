<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4dcc">
  <title>Iniciar sesión | QR Médico</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <main class="auth-page">
    <a class="brand" href="index.html" aria-label="QR Médico, volver al inicio">
      <span class="brand-mark">+</span><span>QR <strong>Médico</strong></span>
    </a>

    <section class="auth-card">
      <p class="eyebrow">Bienvenido de nuevo</p>
      <h1>Inicia sesión</h1>
      <p class="auth-intro">Accede a tus perfiles médicos y códigos QR.</p>

      <form id="login-form" novalidate>
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="tu@correo.com" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="Tu contraseña"
               required minlength="6">

        <button id="login-button" type="submit">Iniciar sesión</button>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <div class="auth-footer">
        ¿Todavía no tienes cuenta? <a href="registro.html">Crear cuenta</a>
      </div>
      <p class="back-link"><a href="index.html">← Volver al inicio</a></p>
    </section>
  </main>
</body>
</html>
